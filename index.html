        { id: 213, name: "배재주유소", district: "서구", dong: "", address: "대전 서구 도솔로 57", phone: "042-532-5700", brand: "HD현대오일뱅크", self: "-", cashback: true, lat: 36.3158199, lng: 127.3731911 },
        { id: 214, name: "세일가스-LPG충전소", district: "중구", dong: "옥계동", address: "대전 중구 대종로117 (옥계동)", phone: "042-271-2271", brand: "GS칼텍스", self: "N", cashback: true, lat: 36.302682, lng: 127.450799 },
        { id: 215, name: "송정가스충전소", district: "유성구", dong: "", address: "대전 유성구 계백로34", phone: "042-586-2220", brand: "SK에너지", self: "N", cashback: true, lat: 36.2784103, lng: 127.2567546 },
        { id: 216, name: "싱글벙글LPG충전소", district: "서구", dong: "정림동", address: "대전 서구 계백로1249번길27 (정림동)", phone: "042-584-2006", brand: "S-OIL", self: "N", cashback: true, lat: 36.3072324, lng: 127.359858 },
        { id: 217, name: "유성학하충전소", district: "유성구", dong: "학하동", address: "대전 유성구 진잠옛로135번길76, 1층 (학하동)", phone: "042-825-8998", brand: "S-OIL", self: "N", cashback: true, lat: 36.3326994, lng: 127.3076799 },
        { id: 218, name: "정림가스충전소", district: "서구", dong: "정림동", address: "대전 서구 계백로1275 (정림동)", phone: "042-523-8235", brand: "GS칼텍스", self: "N", cashback: true, lat: 36.3080311, lng: 127.3643956 },
        { id: 219, name: "정민가스충전소", district: "대덕구", dong: "", address: "대전 대덕구 대전로1020번길 47", phone: "042-623-0487", brand: "SK에너지", self: "N", cashback: true, lat: 36.3485613, lng: 127.4194389 },
        { id: 220, name: "진잠유통단지LPG충전소", district: "유성구", dong: "", address: "대전 유성구 교촌동331-1,8번지", phone: "042-544-1777", brand: "HD현대오일뱅크", self: "N", cashback: true, lat: 36.3112638, lng: 127.3178455 },
        { id: 221, name: "상서충전소", district: "대덕구", dong: "상서동", address: "대전 대덕구 신탄진로484 (상서동)", phone: "042-932-6460", brand: "GS칼텍스", self: "N", cashback: true, lat: 36.4225022, lng: 127.4198891 }
      ];

      const districts = ['전체', '서구', '유성구', '중구', '동구', '대덕구'];
      // 구별 전체/캐시백 가능 개수
      const stat = (d) => {
        const l = stations.filter(s => d === '전체' || s.district === d);
        return { ok: l.filter(s => s.cashback === true).length, total: l.length };
      };

      const filteredStations = stations.filter(s => {
        const matchDistrict = selectedDistrict === '전체' || s.district === selectedDistrict;
        const matchCashback = !onlyCashback || s.cashback === true;
        return matchDistrict && matchCashback;
      });

      const mappable = filteredStations.filter(s => s.lat != null).length; // 지도에 찍을 수 있는 수
      const missing = filteredStations.length - mappable;

      // 검색어 정리: 공백, ㈜, (주), 주식회사 무시
      const norm = (t) => String(t).replace(/[\s㈜()（）]/g, '').replace(/주식회사/g, '').toLowerCase();
      const q = norm(searchTerm);
      const suggestions = q
        ? stations
            .filter(s => [s.name, s.dong, s.address, s.district].some(f => norm(f).includes(q)))
            .sort((a, b) => (norm(b.name).includes(q) ? 1 : 0) - (norm(a.name).includes(q) ? 1 : 0))
        : [];

      const fitTo = (list) => {
        const map = mapRef.current;
        list = list.filter(s => s.lat != null);
        if (!map || !list.length) return;
        if (list.length === 1) setView(map, list[0].lat, list[0].lng, 17);
        else fitList(map, list);
      };

      // 한 곳을 고른 경우(클릭/방향키+엔터) 또는 엔터만 친 경우(검색된 전체를 보여줌)
      const pickSearch = (one) => {
        if (one) {
          setSearchHits([]);
          setSelectedStation(one);
          setSearchTerm(one.name);
          fitTo([one]);
        } else if (suggestions.length) {
          setSearchHits(suggestions);
          setSelectedStation(suggestions[0]);
          fitTo(suggestions);
        }
        setOpenSug(false);
        setActiveIdx(-1);
      };

      const onSearchKey = (e) => {
        const n = Math.min(suggestions.length, 8);
        if (e.key === 'ArrowDown') { e.preventDefault(); setOpenSug(true); setActiveIdx(i => (i + 1) % Math.max(n, 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActiveIdx(i => (i <= 0 ? n - 1 : i - 1)); }
        else if (e.key === 'Enter') { e.preventDefault(); pickSearch(activeIdx >= 0 ? suggestions[activeIdx] : null); }
        else if (e.key === 'Escape') { setOpenSug(false); }
      };

      // 체크박스 변경: 보이는 주유소로 지도를 맞춰 이동 (없으면 구 중심으로)
      const toggleOnly = (v) => {
        setOnlyCashback(v);
        setSearchHits([]);
        setSelectedStation(null);
        const list = stations.filter(s => s.lat != null && (selectedDistrict === '전체' || s.district === selectedDistrict) && (!v || s.cashback === true));
        if (list.length) {
          const map = mapRef.current;
          if (map && list.length > 1) fitList(map, list);
          else fitTo(list);
        } else if (mapRef.current) {
          const [la, ln, z] = districtCoords[selectedDistrict];
          setView(mapRef.current, la, ln, z);
        }
      };

      // [수정5] 선택한 주유소 기준 가까운 주유소 3개 (체크 상태면 캐시백 가능만)
      const nearby = selectedStation && selectedStation.lat != null
        ? stations
            .filter(s => s.lat != null && s.id !== selectedStation.id && (!onlyCashback || s.cashback))
            .map(s => ({ s, d: Math.hypot(s.lat - selectedStation.lat, (s.lng - selectedStation.lng) * 0.8) }))
            .sort((a, b) => a.d - b.d)
            .slice(0, 3)
            .map(x => x.s)
        : [];

      const stationList = selectedStation
        ? [selectedStation, ...nearby]
        : filteredStations.filter(s => s.lat != null && s.lng != null);
      const visibleStationList = showAllStations ? stationList : stationList.slice(0, 3);

      // 네이버 지도 생성 (로고·저작권 표기는 기본값 그대로 둡니다)
      useEffect(() => {
        if (mapRef.current || !document.getElementById('map')) return;
        if (typeof naver === 'undefined' || !naver.maps) {
          document.getElementById('map').innerHTML = '<div style="padding:12px;font-size:12px;line-height:1.6">❌ 네이버 지도 스크립트를 불러오지 못했습니다.<br>index.html 위쪽의 YOUR_NAVER_CLIENT_ID를 발급받은 Client ID로 바꿨는지, 광고 차단 확장 프로그램이 꺼져 있는지 확인해 주세요.</div>';
          return;
        }
        const map = new naver.maps.Map('map', {
          center: LL(HOME[0], HOME[1]),
          zoom: HOME[2],
          zoomControl: true,
          zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT },
          scaleControl: true,
          mapDataControl: true,
          logoControl: true,
          mapTypeControl: false
        });
        mapRef.current = map;
        setMapReady(true); // 지도 준비 후 마커를 그리도록 알림
        window.addEventListener('resize', () => { try { map.autoResize(); } catch (e) {} });
      }, []);

      // [수정3] 구 변경 시 대표 사거리로 이동
      useEffect(() => {
        if (mapRef.current && districtCoords[selectedDistrict]) {
          const [lat, lng, zoom] = districtCoords[selectedDistrict];
          setView(mapRef.current, lat, lng, zoom);
        }
      }, [selectedDistrict, mapReady]);

      // [수정2,4,6] 마커: 필터 결과 전부 표시, 풀네임 라벨, mapReady 의존 추가
      useEffect(() => {
        if (!mapRef.current) return;
        markersGroupRef.current.forEach(m => m.setMap(null));
        markersGroupRef.current = [];
        const draw = [...filteredStations];
        [...searchHits, selectedStation].forEach(s => { if (s && !draw.some(x => x.id === s.id)) draw.push(s); });
        draw.filter(s => s.lat != null).forEach(s => {
          const sel = selectedStation && selectedStation.id === s.id;
          const marker = new naver.maps.Marker({
            position: LL(s.lat, s.lng),
            map: mapRef.current,
            title: s.name,
            zIndex: sel ? 100 : 1,
            icon: {
              content: `<div class="pin ${s.cashback === true ? '' : 'off'} ${sel ? 'sel' : ''}"><i></i><b>${escH(s.name)}</b></div>`,
              anchor: new naver.maps.Point(8, 8)
            }
          });
          naver.maps.Event.addListener(marker, 'click', () => setSelectedStation(s));
          markersGroupRef.current.push(marker);
        });
      }, [mapReady, onlyCashback, selectedDistrict, selectedStation, searchHits]);

      // 제보 목록 불러오기 (30초마다 갱신)
      const loadFeedback = () => {
        fetch('/api/feedback')
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(d => { setFeedbacks(Array.isArray(d) ? d : []); setFbMsg(''); })
          .catch(() => setFbMsg('제보 서버에 연결되지 않았습니다.'));
      };
      useEffect(() => {
        loadFeedback();
        const t = setInterval(loadFeedback, 30000);
        return () => clearInterval(t);
      }, []);

      const selectedFeedbacks = selectedStation
        ? feedbacks.filter(fb => fb.station === selectedStation.name).slice(0, 5)
        : [];
      const recentFeedbacks = feedbacks.slice(0, 10);

      const handleCopyAddress = (addr) => {
        navigator.clipboard.writeText(addr);
        setCopyStatus(true);
        setTimeout(() => setCopyStatus(false), 2000);
      };

      const handleAddFeedback = (status) => {
        if (!selectedStation) {
          setFbNotice('⚠️ 먼저 지도에서 주유소 점을 눌러 선택해 주세요.');
          return;
        }
        setFbNotice('등록 중...');
        fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ station: selectedStation.name, status })
        })
          .then(r => {
            if (r.status === 429) { setFbNotice('⏱️ 제보는 1분에 한 번만 가능합니다.'); return; }
            if (!r.ok) throw new Error();
            setFbNotice('✅ 제보가 등록되었습니다. 감사합니다!');
            loadFeedback(); // 바로 목록 갱신
          })
          .catch(() => setFbNotice('❌ 제보 서버가 아직 연결되지 않아 등록할 수 없습니다.'));
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 font-sans pb-28">
          <header className="hero sticky top-0 z-50 px-4 pt-5 pb-4 shadow-sm">
            <div className="relative z-10 max-w-md md:max-w-5xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <span className="brand-mark text-emerald-600" aria-hidden="true"><svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M9 42V8a4 4 0 0 1 4-4h17a4 4 0 0 1 4 4v34M5 42h31M15 11h13v11H15zM34 13l7 7v14a4 4 0 0 1-8 0V23"/><path d="M38 17h4"/></svg></span>
                <div>
                  <h1 className="hero-title text-xl sm:text-2xl font-black">대전 온통대전<br/><em>주유소 캐시백 지도</em></h1>
                  <p className="mt-1 text-[11px] text-slate-500">시민 제보로 함께 만드는 주유소 정보</p>
                </div>
              </div>
              <button onClick={() => setMenuOpen(v => !v)} aria-label="메뉴 열기" className="rounded-xl p-3 text-2xl text-emerald-950 hover:bg-white/70">☰</button>
            </div>
            <div className="hanbit-art" aria-hidden="true"><svg viewBox="0 0 280 170" width="100%" height="100%"><path d="M0 145h280M8 145v-32h20v32m8 0V96h26v49m8 0v-42h15v42m14 0V111h23v34m95 0v-30h19v30m8 0V91h27v54m8 0v-40h19v40" fill="none" stroke="#15905d" strokeWidth="3" strokeLinejoin="round"/><path d="M135 146V35m0 0v-17m-33 39h66l-7 18h-52zM112 77h46v12h-46zM121 90h28l9 56h-46z" fill="#168653" opacity=".72"/><path d="M30 130q35-16 68 0t68 0 68 0" fill="none" stroke="#55b985" strokeWidth="3"/><circle cx="135" cy="13" r="4" fill="#72c59a"/></svg></div>
            {menuOpen && <nav className="max-w-md md:max-w-5xl mx-auto mt-3 rounded-2xl border border-emerald-100 bg-white p-3 shadow-lg grid grid-cols-2 gap-2 text-sm font-semibold">
              <a href="#map-section" onClick={() => setMenuOpen(false)} className="rounded-lg p-2 hover:bg-emerald-50">🗺️ 지도</a>
              <button onClick={() => { setInfoPage('guide'); setMenuOpen(false); }} className="rounded-lg p-2 text-left hover:bg-emerald-50">ℹ️ 이용안내</button>
              <button onClick={() => { setInfoPage('notice'); setMenuOpen(false); }} className="rounded-lg p-2 text-left hover:bg-emerald-50">📢 공지사항</button>
              <button onClick={() => { setInfoPage('faq'); setMenuOpen(false); }} className="rounded-lg p-2 text-left hover:bg-emerald-50">❔ FAQ</button>
              <button onClick={() => { setInfoPage('privacy'); setMenuOpen(false); }} className="rounded-lg p-2 text-left hover:bg-emerald-50">🛡️ 개인정보 처리 안내</button>
              <a href={SUGGEST_FORM_URL} target="_blank" rel="noreferrer" onClick={() => setMenuOpen(false)} className="rounded-lg p-2 hover:bg-emerald-50">💬 건의사항</a>
            </nav>}
          </header>

          <main className="app-main max-w-md md:max-w-5xl mx-auto p-4 space-y-4">
            <div className="notice-card rounded-2xl p-4 text-xs leading-relaxed shadow-sm">
              <strong className="block mb-1 text-sm text-emerald-900">이용 전 확인해 주세요</strong>
              캐시백 혜택은 온통대전 운영 정책과 예산에 따라 변경될 수 있어요. 방문 전 온통대전 앱에서 최신 가맹점 정보를 확인해 주세요.
            </div>

            <div className="bg-white p-3 rounded-xl shadow-sm space-y-3">
              <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-2xl text-emerald-600 pointer-events-none">⌕</span>
                <input
                  type="text"
                  placeholder="주유소명 또는 주소 검색"
                  value={searchTerm}
                  onChange={(e) => { setSearchTerm(e.target.value); setOpenSug(true); setActiveIdx(-1); setSearchHits([]); }}
                  onFocus={() => setOpenSug(true)}
                  onBlur={() => setTimeout(() => setOpenSug(false), 150)}
                  onKeyDown={onSearchKey}
                  className="w-full h-14 pl-12 pr-16 border-0 rounded-2xl text-base shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-300"
                />
                <button type="button" onClick={() => suggestions.length && pickSearch(null)} aria-label="검색" className="absolute right-0 top-0 h-14 w-14 rounded-r-2xl bg-emerald-600 text-2xl text-white shadow-sm hover:bg-emerald-700">⌕</button>
                {openSug && searchTerm.trim() && (
                  <ul className="absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 max-h-64 overflow-auto text-sm">
                    {suggestions.length === 0 && (
                      <li className="px-3 py-2 text-xs text-slate-500">일치하는 주유소가 없습니다.</li>
                    )}
                    {suggestions.slice(0, 8).map((s, i) => (
                      <li
                        key={s.id}
                        onMouseDown={(e) => { e.preventDefault(); pickSearch(s); }}
                        className={`px-3 py-2 cursor-pointer flex justify-between gap-2 ${i === activeIdx ? 'bg-emerald-50' : 'hover:bg-slate-50'}`}
                      >
                        <span className="font-medium text-slate-800 truncate">{s.name}</span>
                        <span className="text-[11px] text-slate-400 whitespace-nowrap">{s.district} {s.dong}</span>
                      </li>
                    ))}
                    {suggestions.length > 8 && (
                      <li className="px-3 py-1.5 text-[11px] text-slate-400">외 {suggestions.length - 8}곳 · 엔터를 누르면 전체 {suggestions.length}곳을 지도에 표시합니다</li>
                    )}
                  </ul>
                )}
              </div>

              <div className="flex gap-1 overflow-x-auto pb-1">
                {districts.map(d => (
                  <button
                    key={d}
                    onClick={() => { setSelectedDistrict(d); setSelectedStation(null); setSearchHits([]); }}
                    className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${selectedDistrict === d ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  >
                    {d} <span className="ml-0.5 opacity-80">{stat(d).ok}</span>
                  </button>
                ))}
              </div>
              <p className="text-xs text-slate-600">
                📍 {selectedDistrict === '전체' ? '대전 전체' : selectedDistrict}: {stat(selectedDistrict).total}곳 중 캐시백 가능 <b className="text-emerald-700">{stat(selectedDistrict).ok}곳</b>
                <span className="text-slate-400"> (구 버튼의 숫자 = 가능 개수)</span>
              </p>

              <div className="flex items-center justify-between pt-1 border-t text-xs">
                <label className="flex items-center gap-2 cursor-pointer font-medium text-slate-700">
                  <input
                    type="checkbox"
                    checked={onlyCashback}
                    onChange={(e) => toggleOnly(e.target.checked)}
                    className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                  />
                  캐시백 가능만 보기 (🟢)
                </label>
                <span className="text-slate-400">조회: {filteredStations.length}개{missing > 0 ? ` (지도 표시 ${mappable})` : ''}</span>
              </div>
            </div>

            {missing > 0 && (
              <div className="bg-sky-50 border border-sky-200 rounded-lg p-3 text-xs text-sky-800 leading-relaxed">
                조회된 {filteredStations.length}곳 중 {missing}곳은 지도 좌표를 준비 중이라 지도에는 아직 표시되지 않습니다. 검색하면 주소·전화번호·상표 정보를 확인할 수 있습니다.
              </div>
            )}

            {/* 지도 영역 */}
            <div id="map-section" className="bg-white border border-emerald-50 rounded-3xl p-2 shadow-lg space-y-2">
              <div className="flex justify-between items-center text-xs text-slate-600 font-bold px-1">
                <span>🗺️ 대전 지역 주유소 지도</span>
                <span className="text-emerald-600 text-[11px]">🟢 캐시백 가능 / ⚪ 불가</span>
              </div>
              <p className="text-[11px] text-slate-600 px-1">
                {selectedDistrict === '전체' ? '대전' : selectedDistrict} 주유소 {stat(selectedDistrict).total}곳 중 <b className="text-emerald-700">캐시백 가능 {stat(selectedDistrict).ok}곳</b> · 운영자 확인 목록 기준
              </p>
              <div className="relative">
                <span className="map-count">등록 주유소 <b className="text-emerald-600">221곳</b></span>
                <div id="map"></div>
              </div>
            </div>

            <section className="bg-white rounded-3xl p-4 shadow-lg border border-emerald-50">
              <div className="mb-2 flex items-center justify-between">
                <h3 className="text-lg font-extrabold text-slate-900"><span className="mr-2 text-emerald-600">⌖</span>{selectedStation ? '선택 주유소 주변 목록' : '주변 주유소 목록'}</h3>
                {stationList.length > 3 && <button onClick={() => setShowAllStations(v => !v)} className="text-sm font-semibold text-emerald-700">{showAllStations ? '접기' : '더보기'} ›</button>}
              </div>
              {visibleStationList.length === 0 && <p className="py-4 text-sm text-slate-500">표시할 좌표가 있는 주유소가 없습니다. 검색 자동완성에서 주유소를 선택해 정보를 확인할 수 있어요.</p>}
              {visibleStationList.map(st => <button key={`list-${st.id}`} onClick={() => { setSelectedStation(st); if(st.lat != null && mapRef.current) setView(mapRef.current,st.lat,st.lng,17); }} className="station-row flex w-full items-center gap-3 py-3 text-left last:border-0">
                <span className="station-icon"><svg viewBox="0 0 48 48" width="30" height="30" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M9 42V8a4 4 0 0 1 4-4h17a4 4 0 0 1 4 4v34M5 42h31M15 11h13v11H15zM34 13l7 7v14a4 4 0 0 1-8 0V23"/></svg></span><span className="min-w-0 flex-1"><b className="block truncate text-sm text-slate-900">{st.name}</b><small className="block truncate text-xs text-slate-500">{st.address}</small></span><span className="text-lg text-emerald-900">›</span>
              </button>)}
            </section>

            {/* 선택 주유소 카드 */}
            {selectedStation ? (
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 space-y-3 shadow-sm">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold">{selectedStation.district} {selectedStation.dong}</span>
                    <h3 className="text-base font-bold text-slate-900 mt-1">{selectedStation.name}</h3>
                  </div>
                  <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${selectedStation.cashback === true ? 'bg-emerald-100 text-emerald-800' : selectedStation.cashback === false ? 'bg-rose-100 text-rose-800' : 'bg-slate-200 text-slate-700'}`}>
                    {cbText(selectedStation)}
                  </span>
                </div>

                <div className="text-xs space-y-1 text-slate-600">
                  <p>📍 주소: {selectedStation.address}</p>
                  <p>📞 전화번호: {selectedStation.phone ? <a href={`tel:${selectedStation.phone.replace(/[^0-9]/g, '')}`} className="text-emerald-700 underline">{selectedStation.phone}</a> : '전화번호 미등록'}</p>
                  <p>🏷️ 상표: {selectedStation.brand || '정보 없음'}</p>
                  <p>⛽ 셀프 여부: {selfText(selectedStation.self)}</p>
                  {selectedStation.lat == null && <p className="text-amber-700">🗺️ 지도 좌표 준비 중 (아래 버튼으로 위치 확인)</p>}
                </div>

                <button
                  onClick={() => handleCopyAddress(selectedStation.address)}
                  className="w-full bg-white border border-emerald-300 text-emerald-700 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-emerald-100 transition"
                >
                  {copyStatus ? '✅ 주소 복사 완료!' : '📋 주소 복사하기'}
                </button>

                <a
                  href={`https://map.kakao.com/link/search/${encodeURIComponent(selectedStation.name + ' ' + selectedStation.address)}`}
                  target="_blank"
                  rel="noreferrer"
                  className="block text-center w-full bg-white border border-slate-300 text-slate-700 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-slate-50 transition"
                >
                  🗺️ 카카오맵에서 위치 보기 ↗
                </a>

                {/* [수정5] 가까운 주유소 3개 */}
                {nearby.length > 0 && (
                <div className="pt-2 border-t border-emerald-200/60">
                  <p className="text-[11px] font-bold text-emerald-900 mb-1.5">💡 근처 주유소</p>
                  <div className="grid grid-cols-1 gap-2">
                    {nearby.map(near => (
                      <div key={near.id} onClick={() => { setSelectedStation(near); mapRef.current && mapRef.current.panTo(LL(near.lat, near.lng)); }} className="bg-white p-2 rounded border border-emerald-100 text-xs cursor-pointer hover:bg-emerald-50 flex justify-between">
                        <span className="font-bold text-slate-800 truncate">{near.name}</span>
                        <span className="text-[10px] text-emerald-600 font-medium">{cbText(near)}</span>
                      </div>
                    ))}
                  </div>
                </div>
                )}
              </div>
            ) : (
              <div className="bg-white border rounded-xl p-4 text-center text-xs text-slate-400">
                👆 지도 위 마커를 누르면 주유소 상세 정보가 뜹니다.
              </div>
            )}

            {/* 오피넷 */}
            <div className="bg-white rounded-xl p-3 shadow-sm flex items-center justify-between">
              <span className="text-xs font-bold text-slate-700">📊 실시간 유가정보 확인하기 (석유공사)</span>
              <a
                href="https://www.opinet.co.kr"
                target="_blank"
                rel="noreferrer"
                className="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-slate-200 transition"
              >
                오피넷 이동 ↗
              </a>
            </div>

            {/* [수정7,8] 시민 실시간 피드백 */}
            <div id="feedback" className="bg-white rounded-3xl p-4 shadow-lg space-y-3 border border-emerald-50">
              <div className="participation-card rounded-2xl p-4">
                <h4 className="text-base font-extrabold text-emerald-950">💙 시민 제보가 모이면 더 정확해져요</h4>
                <p className="mt-1 text-xs leading-relaxed text-slate-600">주유소를 선택하고 실제 온통대전 캐시백 이용 결과를 알려주세요. 여러분의 참여가 다음 시민에게 도움이 됩니다.</p>
              </div>
              <h4 className="text-sm font-bold text-slate-900">💬 시민 이용 피드백</h4>

              <div className="bg-slate-50 p-3 rounded-lg border space-y-2">
                <div className="text-xs text-slate-700">
                  선택한 주유소: <strong className="text-emerald-700">{selectedStation ? selectedStation.name : '없음 (지도 마커를 먼저 선택하세요)'}</strong>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => handleAddFeedback('가능')}
                    className="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-emerald-700 transition shadow-sm"
                  >
                    🟢 캐시백 가능
                  </button>
                  <button
                    onClick={() => handleAddFeedback('불가')}
                    className="flex-1 bg-rose-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-rose-700 transition shadow-sm"
                  >
                    🔴 캐시백 불가
                  </button>
                </div>
                {fbNotice && <p className="text-[11px] text-slate-600">{fbNotice}</p>}
              </div>

              <section className="space-y-2 rounded-xl border border-emerald-100 bg-emerald-50/60 p-3">
                <h5 className="text-xs font-bold text-emerald-950">📍 선택한 주유소 피드백 (최대 5건)</h5>
                {!selectedStation && <p className="text-[11px] text-slate-500">지도에서 주유소를 선택하면 해당 주유소의 피드백이 여기에 표시됩니다.</p>}
                {selectedStation && selectedFeedbacks.length === 0 && <p className="text-[11px] text-slate-500">이 주유소에 등록된 피드백이 아직 없습니다.</p>}
                {selectedFeedbacks.map((fb, i) => (
                  <div key={`station-${i}`} className="flex flex-wrap gap-1 items-center justify-between text-xs py-1.5 px-2 bg-white rounded border border-emerald-100">
                    <span className={`font-bold px-1.5 py-0.5 rounded text-[10px] ${fb.status === '가능' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                      {fb.status === '가능' ? '🟢 가능' : '🔴 불가'}
                    </span>
                    <span className="text-[10px] text-slate-400 whitespace-nowrap tabular-nums">{fmtTime(fb.created)}</span>
                  </div>
                ))}
              </section>

              <section className="space-y-2">
                <h5 className="text-xs font-bold text-slate-800">전체 최신 피드백 (최대 10건)</h5>
                <div className="space-y-1">
                  {fbMsg && <p className="text-[11px] text-slate-400 text-center">{fbMsg}</p>}
                  {!fbMsg && recentFeedbacks.length === 0 && <p className="text-[11px] text-slate-400 text-center">아직 제보가 없습니다. 첫 제보를 남겨주세요!</p>}
                  {recentFeedbacks.map((fb, i) => (
                    <div key={`all-${i}`} className="flex flex-wrap gap-1 items-center justify-between text-xs py-1.5 px-2 bg-slate-50 rounded border border-slate-100">
                      <div className="flex items-center gap-2">
                        <span className={`font-bold px-1.5 py-0.5 rounded text-[10px] ${fb.status === '가능' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                          {fb.status === '가능' ? '🟢 가능' : '🔴 불가'}
                        </span>
                        <span className="font-semibold text-slate-800">{fb.station}</span>
                      </div>
                      <span className="text-[10px] text-slate-400 whitespace-nowrap tabular-nums">{fmtTime(fb.created)}</span>
                    </div>
                  ))}
                </div>
              </section>
            </div>

            <section id="site-guide" className="space-y-2">
              <h4 className="px-1 text-lg font-extrabold text-slate-900">한눈에 보는 안내</h4>
              <div className="grid grid-cols-3 gap-2">
                <button onClick={() => setInfoPage('guide')} className="icon-tile rounded-2xl p-2"><span className="tile-icon"><svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="16" cy="16" r="12"/><path d="M16 14v8m0-14h.01"/></svg></span><b className="text-xs">이용안내</b></button>
                <button onClick={() => setInfoPage('notice')} className="icon-tile rounded-2xl p-2"><span className="tile-icon"><svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinejoin="round"><path d="M4 13h6l15-6v18l-15-6H4zM10 19l3 8h5l-4-9M26 12l3-3m-3 12 3 3"/></svg></span><b className="text-xs">공지사항</b></button>
                <button onClick={() => setInfoPage('faq')} className="icon-tile rounded-2xl p-2"><span className="tile-icon"><svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="16" cy="16" r="12"/><path d="M12.5 12a3.6 3.6 0 1 1 6.2 2.5c-1.6 1.6-2.7 2.2-2.7 4.5m0 4h.01"/></svg></span><b className="text-xs">FAQ</b></button>
                <a href={SUGGEST_FORM_URL} target="_blank" rel="noreferrer" className="icon-tile rounded-2xl p-2"><span className="tile-icon"><svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinejoin="round"><path d="M5 6h22v16H15l-7 5v-5H5zM10 12h12m-12 5h8"/></svg></span><b className="text-xs">건의사항</b></a>
                <button onClick={() => setInfoPage('operator')} className="icon-tile rounded-2xl p-2"><span className="tile-icon"><svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="16" cy="9" r="5"/><path d="M6 28c.7-6 4.3-9 10-9s9.3 3 10 9"/></svg></span><b className="text-xs">운영자 소개</b></button>
                <button onClick={() => setInfoPage('privacy')} className="icon-tile rounded-2xl p-2"><span className="tile-icon"><svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinejoin="round"><path d="M16 3 27 7v8c0 7-4.5 11-11 14C9.5 26 5 22 5 15V7z"/><path d="m10 16 4 4 8-9"/></svg></span><b className="text-[10px] leading-tight">개인정보처리방침</b></button>
              </div>
            </section>
            {infoPage && <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center bg-slate-950/40 p-0 sm:p-4" onClick={() => setInfoPage('')}>
              <section role="dialog" aria-modal="true" className="w-full max-w-lg max-h-[82vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl bg-white p-5 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="mb-4 flex items-center justify-between"><h3 className="text-lg font-extrabold text-slate-900">{{guide:'이용안내',notice:'공지사항',faq:'자주 묻는 질문',operator:'운영자 소개',privacy:'개인정보처리방침'}[infoPage]}</h3><button onClick={() => setInfoPage('')} className="rounded-full bg-slate-100 px-3 py-1 text-xl">×</button></div>
                {infoPage==='guide' && <div className="space-y-3 text-sm leading-relaxed text-slate-700"><p>검색창에서 주유소명이나 주소를 검색하거나 지도 마커를 눌러 상세 정보를 확인하세요.</p><p>초록색 표시는 운영자가 온통대전 앱에서 캐시백 가능을 확인한 82곳입니다. 결제 전 최신 가맹점 상태를 앱에서 확인해 주세요.</p><p>정보가 다르면 시민 피드백으로 알려주세요. 제보는 1분 간격으로 등록할 수 있습니다.</p></div>}
                {infoPage==='notice' && <p className="text-sm leading-relaxed text-slate-700">주유소 정보와 좌표를 계속 확인하고 업데이트하고 있습니다. 수정할 정보가 있으면 시민 피드백이나 건의사항으로 알려주세요.</p>}
                {infoPage==='faq' && <div className="space-y-4 text-sm leading-relaxed text-slate-700"><p><b>캐시백 가능 표시는 어떤 기준인가요?</b><br/>운영자가 온통대전 앱에서 확인한 82곳을 표시합니다. 정책이나 가맹점 상태가 바뀔 수 있으니 결제 전 앱에서 다시 확인해 주세요.</p><p><b>주유소를 눌러도 지도에서 움직이지 않아요.</b><br/>좌표가 준비된 곳은 지도가 해당 위치로 이동합니다. 검색 자동완성에서는 좌표가 없어도 주소와 연락처를 확인할 수 있습니다.</p><p><b>정보가 맞지 않으면 어떻게 하나요?</b><br/>시민 피드백으로 알려주세요. 중복 제보를 줄이기 위해 1분 간격 제한이 적용됩니다.</p></div>}
                {infoPage==='operator' && <p className="text-sm leading-relaxed text-slate-700">[운영자명, 운영 목적, 문의 이메일을 입력해 주세요.] 이 사이트는 시민 편의를 위한 정보 안내이며 온통대전 운영기관의 공식 서비스가 아닙니다.</p>}
                {infoPage==='privacy' && <div className="space-y-4 text-sm leading-relaxed text-slate-700"><div><h4 className="font-bold text-slate-900">이용약관</h4><p>본 사이트는 참고용 정보를 제공하며 캐시백 적용을 보장하지 않습니다. 결제 전에 온통대전 앱에서 최신 가맹점 상태를 확인해 주세요. [운영자명·시행일·문의처를 공개 전에 입력해 주세요.]</p></div><div><h4 className="font-bold text-slate-900">개인정보 처리방침</h4><p>피드백 기능은 선택한 주유소와 이용자가 선택한 가능/불가 상태를 서버에 전달합니다. [실제 수집 항목·보유 기간·삭제 요청 방법·문의처를 운영 방식에 맞게 입력한 뒤 공개해 주세요.]</p></div></div>}
              </section>
            </div>}
            <nav className="bottom-nav fixed bottom-0 left-0 right-0 z-40 grid grid-cols-4 border-t border-emerald-100 bg-white/95 px-2 pt-2 text-center text-[11px] font-semibold text-slate-600 backdrop-blur">
              <a href="#map-section" className="py-2 text-emerald-600"><span className="block text-xl">⌖</span>지도</a>
              <button onClick={() => setInfoPage('guide')} className="py-2"><span className="block text-xl">▤</span>이용안내</button>
              <button onClick={() => setInfoPage('notice')} className="py-2"><span className="block text-xl">♧</span>공지사항</button>
              <button onClick={() => setInfoPage('privacy')} className="py-2"><span className="block text-xl">•••</span>더보기</button>
            </nav>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
