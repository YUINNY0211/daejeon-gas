<script>
(function(){
'use strict';
// ... (중략: 기존 stations, 지도 및 검색 관련 함수들은 그대로 유지) ...

// 1. 소식 대신 '📘 온통대전 가이드' 4가지 항목 데이터 연결
const newsList=[
  {q:'1. 온통대전 이용내역 및 캐시백 적립 확인하는 방법', a:'1. 온통대전 앱 메인 화면의 [나의캐시 (온통지갑)] 우측에 있는 아래 화살표(▼) 버튼을 누릅니다.<br>2. 하단에 펼쳐지는 메뉴 중 [이용내역]을 선택합니다.<br>3. 상단 [사용내역] [캐시백] 탭을 통해 결제내역 및 캐시백 금액을 상세히 볼 수 있습니다.'},
  {q:'2. 온통대전 앱 내 공식 가맹점 직접 찾는 방법', a:'홈 화면 우측 상단(알림 종 아이콘 아래)에 위치한 [가맹점 찾기] 버튼을 누릅니다.<br><br>검색창에 방문하려는 주유소 상호명을 입력해 현재 가맹점 등록 상태를 확인합니다.'},
  {q:'3. 11월 온통대전 캐시백 혜택 및 충전 한도 안내', a:'11월 월 충전 한도: 70만 원<br><br>📅 11월 16일 ~ 11월 30일<br>일반 사용자: 13% 적립<br>복지 대상자: 16% 적립'},
  {q:'4. 온통대전(대전사랑카드) 카드 발급 및 충전 방법 안내', a:'아직 온통대전 카드가 없거나 실물 카드를 새로 발급받고 싶으신 분들을 위한 신청 절차입니다. 만 14세 이상이면 거주지와 관계없이 누구나 무료로 발급받을 수 있습니다.<br><br><b>1. 앱 설치 및 회원가입</b><br>구글 플레이스토어 또는 애플 앱스토어에서 ‘온통대전’ 앱을 설치한 뒤 본인 인증을 거쳐 가입합니다.<br><br><b>2. 카드 신청 선택</b><br>앱 메인 화면의 [카드 신청] 메뉴를 눌러 원하는 디자인과 제휴 카드사(하나카드·농협 등 체크카드)를 선택합니다.<br><br><b>3. 수령 및 카드 등록</b><br>우편으로 실물 카드를 수령한 뒤 앱 내 [카드 관리 > 카드 등록]에서 카드 번호와 CVC 번호를 입력해 활성화합니다. (배송을 기다리기 어려우신 경우 가까운 하나은행 영업점 방문을 통한 즉시 발급도 가능합니다.)<br><br><b>4. 계좌 연결 및 충전</b><br>본인 명의 은행 계좌를 연결하고 금액을 충전하면, 대전 지역 가맹 주유소 결제 시 즉시 캐시백 혜택을 받으실 수 있습니다.'}
];

function renderNewsMain(){
  const box=$('modalContent');
  box.innerHTML = '<p class="swipe-hint">↔ 옆으로 넘겨서 확인하세요</p>'
    +'<div class="swipe-track">'
    +'<div class="swipe-slide">'
    +'<h3 style="margin-top:0 !important">📘 온통대전 가이드</h3>'
    +'<div class="faq-index-list">'
    +newsList.map((item,i)=>'<button type="button" class="faq-index-btn" data-news-idx="'+i+'">'+item.q+'</button>').join('')
    +'</div></div>'
    +'</div>';
  setupModalSwipe(box);
  box.querySelectorAll('[data-news-idx]').forEach(btn=>{
    btn.onclick=()=>{
      const idx=Number(btn.dataset.newsIdx);
      const target=newsList[idx];
      box.innerHTML='<button type="button" class="faq-back-btn" id="newsBackBtn">◀ 목록으로 돌아가기</button>'
        +'<div class="swipe-slide" style="min-height:160px;margin-top:6px;">'
        +'<h3 style="margin-top:0 !important">'+target.q+'</h3>'
        +'<p>'+target.a+'</p>'
        +'</div>';
      $('newsBackBtn').onclick=renderNewsMain;
    };
  });
}

// ... (중략: 기존 faqList 및 renderFaqMain 함수 유지) ...

function openPage(key){
  // 2. 모달 상단 타이틀을 '📘 온통대전 가이드'로 정확히 매핑
  const title={guide:'이용안내',faq:'자주 묻는 질문',notice:'공지사항',updates:'업데이트',privacy:'개인정보 처리방침',operator:'서비스 소개',news:'📘 온통대전 가이드'};
  $('modalTitle').textContent=title[key]||'';
  const box=$('modalContent');

  if(key==='faq'){
    renderFaqMain();
    $('modal').hidden=false;
    return;
  }

  // 3. news 키가 들어오면 가이드 목록 렌더링 함수 호출
  if(key==='news'){
    renderNewsMain();
    $('modal').hidden=false;
    return;
  }

  const content={
    guide:'...', // (기존 이용안내 내용)
    notice:'...', // (기존 공지사항 내용)
    updates:'...', // (기존 업데이트 내용)
    operator:'...', // (기존 서비스 소개 내용)
    privacy:'...' // (기존 개인정보 처리방침 내용)
  };

  box.innerHTML=content[key]||'';
  setupModalSwipe(box);
  $('modal').hidden=false;
}

// ... (하단 기존 이벤트 리스너 및 초기화 코드 유지) ...
})();
</script>
