:root{--bg:#f1f5f4;--card:#fff;--ink:#16302b;--sub:#5d726d;--line:#dbe5e2;--on:#0f8f6a;--off:#8a9692}
@media (prefers-color-scheme:dark){:root{--bg:#10201d;--card:#183029;--ink:#e8f3f0;--sub:#9db5af;--line:#2a463f;--on:#2fc79a;--off:#7f8f8a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
header{background:var(--on);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}header p{margin:2px 0 0;font-size:12px;opacity:.9}
main{max-width:480px;margin:0 auto;padding:12px;display:grid;gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.notice{font-size:12px;color:var(--sub);line-height:1.5}
input[type=search]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:16px;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--on);color:#fff;border-color:var(--on)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
/* 지도: 고정 높이 + Tailwind/리셋 CSS로 타일이 밀리는 문제 방지 */
#map{height:380px;width:100%;border-radius:8px;z-index:0}
.leaflet-container img,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;height:auto}
.pin{display:flex;align-items:center;gap:3px;transform:translate(-7px,-7px);width:max-content}
.pin i{width:14px;height:14px;border-radius:50%;background:var(--on);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);flex:none}
.pin.off i{background:var(--off)}
.pin b{display:none;font-size:11px;background:#fff;color:#16302b;padding:1px 5px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.3);font-weight:600}
.zoomed .pin b{display:inline}
.pin.sel i{outline:3px solid #f59e0b}
#detail h3{margin:4px 0;font-size:16px}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;color:#fff;background:var(--on)}
.badge.off{background:var(--off)}
#detail p{margin:3px 0;font-size:13px;color:var(--sub)}
.btns{display:flex;gap:6px;margin-top:8px}
.btns a,.btns button{flex:1;text-align:center;padding:8px;border:1px solid var(--on);color:var(--on);background:transparent;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
#list{max-height:260px;overflow:auto;display:grid;gap:4px}
#list button{display:flex;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 9px;border-radius:8px;font-size:13px;cursor:pointer}
#list span{color:var(--sub);font-size:11px}
footer{font-size:11px;color:var(--sub);text-align:center;padding:4px 0 24px}

  layer.clearLayers();markers={};
  list.forEach(function(s){
    var m=L.marker([s.lat,s.lng],{icon:pinIcon(s),title:s.name,keyboard:true}).addTo(layer);
    m.on('click',function(){select(s,false);});
    markers[s.id]=m;
  });
  $('count').textContent='표시 '+list.length+'개';
  var box=$('list');box.innerHTML='';
  list.forEach(function(s){
    var b=document.createElement('button');
    b.innerHTML=(s.cb?'🟢 ':'⚪ ')+esc(s.name)+'<span>'+esc(s.gu+' '+s.dong)+'</span>';
    b.onclick=function(){select(s,true);};
    box.appendChild(b);
  });
  if(!list.length)box.textContent='조건에 맞는 주유소가 없습니다.';
  if(fit&&list.length){
    if(list.length===1)map.setView([list[0].lat,list[0].lng],16);
    else map.fitBounds(L.latLngBounds(list.map(function(s){return[s.lat,s.lng];})),{padding:[30,30],maxZoom:16});
  }
}

function select(s,pan){
  var prev=sel;sel=s;
  if(prev&&markers[prev.id])markers[prev.id].setIcon(pinIcon(prev));
  if(markers[s.id])markers[s.id].setIcon(pinIcon(s));
  if(pan)map.setView([s.lat,s.lng],Math.max(map.getZoom(),16));
  var d=$('detail');
  d.innerHTML='<span class="badge'+(s.cb?'':' off')+'">'+(s.cb?'🟢 캐시백 가능':'⚪ 캐시백 불가')+'</span>'+
    '<h3>'+esc(s.name)+'</h3><p>📍 '+esc(s.addr)+'</p><p>📞 '+esc(s.tel)+'</p>'+
    '<div class="btns"><button id="cp">주소 복사</button><a href="tel:'+esc(s.tel.replace(/[^0-9]/g,''))+'">전화</a></div>';
  $('cp').onclick=function(){
    var b=this;
    (navigator.clipboard?navigator.clipboard.writeText(s.addr):Promise.reject()).then(function(){b.textContent='✅ 복사됨';},function(){b.textContent='복사 실패';});
    setTimeout(function(){b.textContent='주소 복사';},1800);
  };
}

/* ===== 이벤트 ===== */
var tabs=$('tabs');
Object.keys(DIST).forEach(function(k){
  var b=document.createElement('button');
  b.textContent=k;if(k===gu)b.className='on';
  b.onclick=function(){
    gu=k;sel=null;
    Array.prototype.forEach.call(tabs.children,function(x){x.className=x===b?'on':'';});
    $('q').value='';
    render(false);
    var c=DIST[k];map.setView([c[0],c[1]],c[2]);   // 구 중심 사거리로 이동
    $('detail').textContent='지도에서 주유소 점을 누르면 상세 정보가 표시됩니다.';
  };
  tabs.appendChild(b);
});
$('only').onchange=function(){only=this.checked;render(false);};
$('q').oninput=function(){render(!!this.value.trim());};

render(false); // 첫 화면: 갤러리아 중심 + 캐시백 가능 주유소
})();
</script>
</body>
</html>
