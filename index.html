        list = list.filter(s => s.lat != null);
        if (!map || !list.length) return;
        if (list.length === 1) setView(map, list[0].lat, list[0].lng, 17);
        else fitList(map, list);
      };

      // 한 곳을 고른 경우(클릭/방향키+엔터) 또는 엔터만 친 경우(검색된 전체를 보여줌)
      const pickSearch = (one) => {
        if (one) {
          setSearchHits([]);
          setSelectedStation(one);
          setSearchTerm(one.name);
          fitTo([one]);
        } else if (suggestions.length) {
          setSearchHits(suggestions);
          setSelectedStation(suggestions[0]);
          fitTo(suggestions);
        }
        setOpenSug(false);
        setActiveIdx(-1);
      };

      const onSearchKey = (e) => {
        const n = Math.min(suggestions.length, 8);
        if (e.key === 'ArrowDown') { e.preventDefault(); setOpenSug(true); setActiveIdx(i => (i + 1) % Math.max(n, 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActiveIdx(i => (i <= 0 ? n - 1 : i - 1)); }
        else if (e.key === 'Enter') { e.preventDefault(); pickSearch(activeIdx >= 0 ? suggestions[activeIdx] : null); }
        else if (e.key === 'Escape') { setOpenSug(false); }
      };

      // 체크박스 변경: 보이는 주유소로 지도를 맞춰 이동 (없으면 구 중심으로)
      const toggleOnly = (v) => {
        setOnlyCashback(v);
        setSearchHits([]);
        const list = stations.filter(s => s.lat != null && (selectedDistrict === '전체' || s.district === selectedDistrict) && (!v || s.cashback === true));
        if (list.length) {
          const map = mapRef.current;
          if (map && list.length > 1) fitList(map, list);
          else fitTo(list);
        } else if (mapRef.current) {
          const [la, ln, z] = districtCoords[selectedDistrict];
          setView(mapRef.current, la, ln, z);
        }
      };

      // [수정5] 선택한 주유소 기준 가까운 주유소 3개 (체크 상태면 캐시백 가능만)
      const nearby = selectedStation && selectedStation.lat != null
        ? stations
            .filter(s => s.lat != null && s.id !== selectedStation.id && (!onlyCashback || s.cashback))
            .map(s => ({ s, d: Math.hypot(s.lat - selectedStation.lat, (s.lng - selectedStation.lng) * 0.8) }))
            .sort((a, b) => a.d - b.d)
            .slice(0, 3)
            .map(x => x.s)
        : [];

      // 네이버 지도 생성 (로고·저작권 표기는 기본값 그대로 둡니다)
      useEffect(() => {
        if (mapRef.current || !document.getElementById('map')) return;
        if (typeof naver === 'undefined' || !naver.maps) {
          document.getElementById('map').innerHTML = '<div style="padding:12px;font-size:12px;line-height:1.6">❌ 네이버 지도 스크립트를 불러오지 못했습니다.<br>index.html 위쪽의 YOUR_NAVER_CLIENT_ID를 발급받은 Client ID로 바꿨는지, 광고 차단 확장 프로그램이 꺼져 있는지 확인해 주세요.</div>';
          return;
        }
        const map = new naver.maps.Map('map', {
          center: LL(HOME[0], HOME[1]),
          zoom: HOME[2],
          zoomControl: true,
          zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT },
          scaleControl: true,
          mapDataControl: true,
          logoControl: true,
          mapTypeControl: false
        });
        mapRef.current = map;
        setMapReady(true); // 지도 준비 후 마커를 그리도록 알림
        window.addEventListener('resize', () => { try { map.autoResize(); } catch (e) {} });
      }, []);

      // [수정3] 구 변경 시 대표 사거리로 이동
      useEffect(() => {
        if (mapRef.current && districtCoords[selectedDistrict]) {
          const [lat, lng, zoom] = districtCoords[selectedDistrict];
          setView(mapRef.current, lat, lng, zoom);
        }
      }, [selectedDistrict, mapReady]);

      // [수정2,4,6] 마커: 필터 결과 전부 표시, 풀네임 라벨, mapReady 의존 추가
      useEffect(() => {
        if (!mapRef.current) return;
        markersGroupRef.current.forEach(m => m.setMap(null));
        markersGroupRef.current = [];
        const draw = [...filteredStations];
        [...searchHits, selectedStation].forEach(s => { if (s && !draw.some(x => x.id === s.id)) draw.push(s); });
        draw.filter(s => s.lat != null).forEach(s => {
          const sel = selectedStation && selectedStation.id === s.id;
          const marker = new naver.maps.Marker({
            position: LL(s.lat, s.lng),
            map: mapRef.current,
            title: s.name,
            zIndex: sel ? 100 : 1,
            icon: {
              content: `<div class="pin ${s.cashback === true ? '' : 'off'} ${sel ? 'sel' : ''}"><i></i><b>${escH(s.name)}</b></div>`,
              anchor: new naver.maps.Point(8, 8)
            }
          });
          naver.maps.Event.addListener(marker, 'click', () => setSelectedStation(s));
          markersGroupRef.current.push(marker);
        });
      }, [mapReady, onlyCashback, selectedDistrict, selectedStation, searchHits]);

      // [수정7,8] 제보 목록 불러오기 (최대 7개, 30초마다 갱신)
      const loadFeedback = () => {
        fetch('/api/feedback')
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(d => { setFeedbacks(d.slice(0, 10)); setFbMsg(''); })
          .catch(() => setFbMsg('제보 서버에 연결되지 않았습니다.'));
      };
      useEffect(() => {
        loadFeedback();
        const t = setInterval(loadFeedback, 30000);
        return () => clearInterval(t);
      }, []);

      const handleCopyAddress = (addr) => {
        navigator.clipboard.writeText(addr);
        setCopyStatus(true);
        setTimeout(() => setCopyStatus(false), 2000);
      };

      const handleAddFeedback = (status) => {
        if (!selectedStation) {
          setFbNotice('⚠️ 먼저 지도에서 주유소 점을 눌러 선택해 주세요.');
          return;
        }
        setFbNotice('등록 중...');
        fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ station: selectedStation.name, status })
        })
          .then(r => {
            if (r.status === 429) { setFbNotice('⏱️ 제보는 1분에 한 번만 가능합니다.'); return; }
            if (!r.ok) throw new Error();
            setFbNotice('✅ 제보가 등록되었습니다. 감사합니다!');
            loadFeedback(); // 바로 목록 갱신
          })
          .catch(() => setFbNotice('❌ 제보 서버가 아직 연결되지 않아 등록할 수 없습니다.'));
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 font-sans pb-12">
          <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
            <div className="max-w-md md:max-w-5xl mx-auto">
              <h1 className="text-lg font-bold">대전 온통대전 캐시백 주유소</h1>
              <p className="text-xs text-emerald-100">대전사랑카드 가맹점 실시간 현황 안내</p>
            </div>
          </header>

          <main className="max-w-md md:max-w-5xl mx-auto p-4 space-y-4">
            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 leading-relaxed">
              ⚠️ 캐시백은 연 매출 30억 원 이하 가맹점 등 조건에 따라 주유소마다 다르고, 정책·예산에 따라 바뀔 수 있습니다. 지도의 "미확인" 주유소는 결제 전 대전사랑카드 앱의 가맹점 찾기에서 꼭 확인해 주세요.
            </div>

            <div className="bg-white p-3 rounded-xl shadow-sm space-y-3">
              <div className="relative">
                <input
                  type="text"
                  placeholder="주유소·동·도로 이름 검색 (예: 용전, 대흥동, 옥천로)"
                  value={searchTerm}
                  onChange={(e) => { setSearchTerm(e.target.value); setOpenSug(true); setActiveIdx(-1); setSearchHits([]); }}
                  onFocus={() => setOpenSug(true)}
                  onBlur={() => setTimeout(() => setOpenSug(false), 150)}
                  onKeyDown={onSearchKey}
                  className="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
                {openSug && searchTerm.trim() && (
                  <ul className="absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 max-h-64 overflow-auto text-sm">
                    {suggestions.length === 0 && (
                      <li className="px-3 py-2 text-xs text-slate-500">일치하는 주유소가 없습니다.</li>
                    )}
                    {suggestions.slice(0, 8).map((s, i) => (
                      <li
                        key={s.id}
                        onMouseDown={(e) => { e.preventDefault(); pickSearch(s); }}
                        className={`px-3 py-2 cursor-pointer flex justify-between gap-2 ${i === activeIdx ? 'bg-emerald-50' : 'hover:bg-slate-50'}`}
                      >
                        <span className="font-medium text-slate-800 truncate">{s.name}</span>
                        <span className="text-[11px] text-slate-400 whitespace-nowrap">{s.district} {s.dong}</span>
                      </li>
                    ))}
                    {suggestions.length > 8 && (
                      <li className="px-3 py-1.5 text-[11px] text-slate-400">외 {suggestions.length - 8}곳 · 엔터를 누르면 전체 {suggestions.length}곳을 지도에 표시합니다</li>
                    )}
                  </ul>
                )}
              </div>

              <div className="flex gap-1 overflow-x-auto pb-1">
                {districts.map(d => (
                  <button
                    key={d}
                    onClick={() => { setSelectedDistrict(d); setSelectedStation(null); setSearchHits([]); }}
                    className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${selectedDistrict === d ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  >
                    {d} <span className="ml-0.5 opacity-80">{stat(d).ok}</span>
                  </button>
                ))}
              </div>
              <p className="text-xs text-slate-600">
                📍 {selectedDistrict === '전체' ? '대전 전체' : selectedDistrict}: {stat(selectedDistrict).total}곳 중 캐시백 가능 <b className="text-emerald-700">{stat(selectedDistrict).ok}곳</b>
                <span className="text-slate-400"> (구 버튼의 숫자 = 가능 개수)</span>
              </p>

              <div className="flex items-center justify-between pt-1 border-t text-xs">
                <label className="flex items-center gap-2 cursor-pointer font-medium text-slate-700">
                  <input
                    type="checkbox"
                    checked={onlyCashback}
                    onChange={(e) => toggleOnly(e.target.checked)}
                    className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                  />
                  캐시백 가능만 보기 (🟢)
                </label>
                <span className="text-slate-400">조회: {filteredStations.length}개{missing > 0 ? ` (지도 표시 ${mappable})` : ''}</span>
              </div>
            </div>

            {missing > 0 && (
              <div className="bg-sky-50 border border-sky-200 rounded-lg p-3 text-xs text-sky-800 leading-relaxed">
                조회된 {filteredStations.length}곳 중 {missing}곳은 지도 좌표를 준비 중이라 지도에는 아직 표시되지 않습니다. 검색하면 주소·전화번호·상표 정보를 확인할 수 있습니다.
              </div>
            )}

            {/* 지도 영역 */}
            <div className="bg-white border rounded-xl p-2 shadow-sm space-y-2">
              <div className="flex justify-between items-center text-xs text-slate-600 font-bold px-1">
                <span>🗺️ 대전 지역 주유소 지도</span>
                <span className="text-emerald-600 text-[11px]">🟢 캐시백 가능 / ⚪ 불가</span>
              </div>
              <p className="text-[11px] text-slate-600 px-1">
                {selectedDistrict === '전체' ? '대전' : selectedDistrict} 주유소 {stat(selectedDistrict).total}곳 중 <b className="text-emerald-700">캐시백 가능 {stat(selectedDistrict).ok}곳</b> · 운영자 확인 목록 기준
              </p>
              <div id="map"></div>
            </div>

            {/* 선택 주유소 카드 */}
            {selectedStation ? (
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 space-y-3 shadow-sm">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold">{selectedStation.district} {selectedStation.dong}</span>
                    <h3 className="text-base font-bold text-slate-900 mt-1">{selectedStation.name}</h3>
                  </div>
                  <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${selectedStation.cashback === true ? 'bg-emerald-100 text-emerald-800' : selectedStation.cashback === false ? 'bg-rose-100 text-rose-800' : 'bg-slate-200 text-slate-700'}`}>
                    {cbText(selectedStation)}
                  </span>
                </div>

                <div className="text-xs space-y-1 text-slate-600">
                  <p>📍 주소: {selectedStation.address}</p>
                  <p>📞 전화번호: {selectedStation.phone ? <a href={`tel:${selectedStation.phone.replace(/[^0-9]/g, '')}`} className="text-emerald-700 underline">{selectedStation.phone}</a> : '전화번호 미등록'}</p>
                  <p>🏷️ 상표: {selectedStation.brand || '정보 없음'}</p>
                  <p>⛽ 셀프 여부: {selfText(selectedStation.self)}</p>
                  {selectedStation.lat == null && <p className="text-amber-700">🗺️ 지도 좌표 준비 중 (아래 버튼으로 위치 확인)</p>}
                </div>

                <button
                  onClick={() => handleCopyAddress(selectedStation.address)}
                  className="w-full bg-white border border-emerald-300 text-emerald-700 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-emerald-100 transition"
                >
                  {copyStatus ? '✅ 주소 복사 완료!' : '📋 주소 복사하기'}
                </button>

                <a
                  href={`https://map.kakao.com/link/search/${encodeURIComponent(selectedStation.name + ' ' + selectedStation.address)}`}
                  target="_blank"
                  rel="noreferrer"
                  className="block text-center w-full bg-white border border-slate-300 text-slate-700 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-slate-50 transition"
                >
                  🗺️ 카카오맵에서 위치 보기 ↗
                </a>

                {/* [수정5] 가까운 주유소 3개 */}
                {nearby.length > 0 && (
                <div className="pt-2 border-t border-emerald-200/60">
                  <p className="text-[11px] font-bold text-emerald-900 mb-1.5">💡 근처 주유소</p>
                  <div className="grid grid-cols-1 gap-2">
                    {nearby.map(near => (
                      <div key={near.id} onClick={() => { setSelectedStation(near); mapRef.current && mapRef.current.panTo(LL(near.lat, near.lng)); }} className="bg-white p-2 rounded border border-emerald-100 text-xs cursor-pointer hover:bg-emerald-50 flex justify-between">
                        <span className="font-bold text-slate-800 truncate">{near.name}</span>
                        <span className="text-[10px] text-emerald-600 font-medium">{cbText(near)}</span>
                      </div>
                    ))}
                  </div>
                </div>
                )}
              </div>
            ) : (
              <div className="bg-white border rounded-xl p-4 text-center text-xs text-slate-400">
                👆 지도 위 마커를 누르면 주유소 상세 정보가 뜹니다.
              </div>
            )}

            {/* 오피넷 */}
            <div className="bg-white rounded-xl p-3 shadow-sm flex items-center justify-between">
              <span className="text-xs font-bold text-slate-700">📊 실시간 유가정보 확인하기 (석유공사)</span>
              <a
                href="https://www.opinet.co.kr"
                target="_blank"
                rel="noreferrer"
                className="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-slate-200 transition"
              >
                오피넷 이동 ↗
              </a>
            </div>

            {/* [수정7,8] 시민 실시간 피드백 */}
            <div className="bg-white rounded-xl p-4 shadow-sm space-y-3">
              <h4 className="text-xs font-bold text-slate-800">💬 시민 실시간 이용 현황 (최근 10건)</h4>

              <div className="bg-slate-50 p-3 rounded-lg border space-y-2">
                <div className="text-xs text-slate-700">
                  선택한 주유소: <strong className="text-emerald-700">{selectedStation ? selectedStation.name : '없음 (지도 마커를 먼저 선택하세요)'}</strong>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => handleAddFeedback('가능')}
                    className="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-emerald-700 transition shadow-sm"
                  >
                    🟢 캐시백 가능
                  </button>
                  <button
                    onClick={() => handleAddFeedback('불가')}
                    className="flex-1 bg-rose-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-rose-700 transition shadow-sm"
                  >
                    🔴 캐시백 불가
                  </button>
                </div>
                {fbNotice && <p className="text-[11px] text-slate-600">{fbNotice}</p>}
              </div>

              <div className="space-y-1">
                {fbMsg && <p className="text-[11px] text-slate-400 text-center">{fbMsg}</p>}
                {!fbMsg && feedbacks.length === 0 && <p className="text-[11px] text-slate-400 text-center">아직 제보가 없습니다. 첫 제보를 남겨주세요!</p>}
                {feedbacks.map((fb, i) => (
                  <div key={i} className="flex flex-wrap gap-1 items-center justify-between text-xs py-1.5 px-2 bg-slate-50 rounded border border-slate-100">
                    <div className="flex items-center gap-2">
                      <span className={`font-bold px-1.5 py-0.5 rounded text-[10px] ${fb.status === '가능' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                        {fb.status === '가능' ? '🟢 가능' : '🔴 불가'}
                      </span>
                      <span className="font-semibold text-slate-800">{fb.station}</span>
                    </div>
                    <span className="text-[10px] text-slate-400 whitespace-nowrap tabular-nums">{fmtTime(fb.created)}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* [수정9] 건의사항: 구글폼 (응답은 운영자만 열람 가능) */}
            <div className="bg-white rounded-xl p-4 shadow-sm space-y-2 border">
              <h4 className="text-xs font-bold text-slate-800">✉️ 운영자에게 건의/의견 보내기</h4>
              <p className="text-[11px] text-slate-500">오류 제보나 개선 의견은 운영자에게만 전달됩니다.</p>
              <a
                href={SUGGEST_FORM_URL}
                target="_blank"
                rel="noreferrer"
                className="block text-center bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-700 transition"
              >
                건의사항 작성하기 ↗
              </a>
            </div>
            <p className="text-[10px] text-slate-400 text-center leading-relaxed">
              주유소 정보는 운영자가 정리한 목록(총 221곳) 기준이며 실제와 다를 수 있습니다. 지도는 네이버 지도를 사용합니다.
            </p>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
